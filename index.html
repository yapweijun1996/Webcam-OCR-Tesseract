<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time Webcam OCR using Tesseract.js - Mobile-responsive camera text recognition">
    <title>Webcam OCR - Tesseract.js Text Recognition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>Webcam OCR</h1>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">Initializing...</span>
            </div>
            <div class="top-loader" id="topLoader"></div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Camera Section -->
            <section class="camera-section">
                <div class="camera-container">
                    <video id="cameraFeed" autoplay playsinline muted></video>
                    <canvas id="captureCanvas" style="display: none;"></canvas>
                    <div class="camera-overlay" id="cameraOverlay">
                        <div class="capture-indicator">
                            <div class="capture-pulse"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Controls Section -->
            <section class="controls-section">
                <div class="control-grid">
                   <div class="button-group">
                       <button id="startBtn" class="btn btn-primary">Start Camera</button>
                       <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
                   </div>

                   <div class="control-group">
                       <button id="captureBtn" class="btn btn-primary" disabled style="grid-column: span 2;">
                           🔄 Start Auto Capture
                       </button>
                   </div>

                   <div class="control-group">
                       <label for="languageSelect">Language Selection</label>
                       <select id="languageSelect" class="language-select">
                           <option value="eng" selected>English</option>
                           <option value="chi_sim">中文简体 (Chinese Simplified)</option>
                           <option value="eng+chi_sim">English + 中文简体</option>
                           <option value="jpn">日本語 (Japanese)</option>
                           <option value="kor">한국어 (Korean)</option>
                           <option value="tha">ไทย (Thai)</option>
                           <option value="ara">العربية (Arabic)</option>
                           <option value="rus">Русский (Russian)</option>
                           <option value="fra">Français (French)</option>
                           <option value="deu">Deutsch (German)</option>
                       </select>
                       <div class="language-info">
                           <small>Select OCR language before capturing</small>
                       </div>
                   </div>

                </div>

                <!-- Debug Info (collapsible) -->
                <details class="debug-info" id="debugInfo" style="display: none;">
                    <summary>Debug Info</summary>
                    <div class="debug-content">
                        <p><strong>Browser:</strong> <span id="debugBrowser"></span></p>
                        <p><strong>HTTPS:</strong> <span id="debugHttps"></span></p>
                        <p><strong>Camera API:</strong> <span id="debugCameraAPI"></span></p>
                        <p><strong>Stream Status:</strong> <span id="debugStream"></span></p>
                        <p><strong>Video Dimensions:</strong> <span id="debugVideoSize"></span></p>
                    </div>
                </details>
            </section>

            <!-- Results Section -->
            <section class="results-section">
                <div class="results-header">
                    <h2>OCR Results</h2>
                    <button id="clearBtn" class="btn btn-outline">Clear</button>
                </div>

                <div class="results-container">
                    <div id="resultsList" class="results-list">
                        <!-- Results will be inserted here -->
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;">
                        <p class="error-text"></p>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer -->
         <footer class="app-footer">
             <p>Webcam OCR with Tesseract.js</p>
         </footer>
     </div>

     <script src="script.js"></script>
</body>
</html>
